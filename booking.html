<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request an appointment | Glow by Chlo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f0f4;--panel:#fffafd;--ink:#2f1b34;--muted:#6b566f;--accent:#8f3f6e;--accent-ink:#fff;--line:#dcc9d8;--err:#a3202f}
*{box-sizing:border-box}
html{scroll-padding-top:1rem}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 Figtree,system-ui,sans-serif}
main{max-width:34rem;margin:0 auto;padding:clamp(1.5rem,6vw,3.5rem) 1.25rem 3rem}
h1{font:400 clamp(2rem,7vw,2.75rem)/1.1 Gloock,Georgia,serif;margin:0 0 .75rem}
.lead{color:var(--muted);margin:0 0 2rem;max-width:30rem}
form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:clamp(1.1rem,4vw,1.75rem);display:grid;gap:1.1rem}
.row{display:grid;gap:1.1rem}
@media(min-width:30rem){.row{grid-template-columns:1fr 1fr}}
label{display:grid;gap:.35rem;font-weight:500;font-size:.95rem}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:.7rem .8rem;width:100%}
textarea{min-height:6rem;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{font-weight:400;color:var(--muted);font-size:.85rem}
button{font:600 1rem Figtree,sans-serif;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:.9rem 1.5rem;cursor:pointer}
button:hover{background:#7a3460}
.note{font-size:.88rem;color:var(--muted);margin:0}
#msg{margin:0;font-weight:500;min-height:1.4em}
#msg.err{color:var(--err)}
#msg.ok{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Request an appointment</h1>
  <p class="lead">Tell us what you'd like and when works for you. We'll reply to confirm your time.</p>

  <form id="f" novalidate>
    <label>Service
      <select name="service" required>
        <option value="">Choose a service</option>
        <option>Facial</option>
        <option>Brow shaping</option>
        <option>Lash lift</option>
        <option>Waxing</option>
        <option>Skin consultation</option>
      </select>
    </label>

    <div class="row">
      <label>Preferred date
        <input type="date" name="date" id="date" required>
      </label>
      <label>Preferred time
        <select name="time" required>
          <option value="">Choose a time</option>
          <option>Morning</option>
          <option>Afternoon</option>
          <option>Evening</option>
        </select>
      </label>
    </div>

    <label>Full name
      <input type="text" name="name" autocomplete="name" required>
    </label>

    <div class="row">
      <label>Phone
        <input type="tel" name="phone" autocomplete="tel" required>
      </label>
      <label>Email
        <input type="email" name="email" autocomplete="email" required>
      </label>
    </div>

    <label>Notes <span class="hint">(optional: skin concerns, allergies, questions)</span>
      <textarea name="notes"></textarea>
    </label>

    <button type="submit">Send request</button>
    <p id="msg" role="status" aria-live="polite"></p>
    <p class="note">This is a request, not a confirmed booking. We'll contact you to confirm.</p>
  </form>
</main>

<script>
// Set this to the address that should receive appointment requests.
var REQUEST_EMAIL = "";

var form = document.getElementById("f");
var msg = document.getElementById("msg");
var dateInput = document.getElementById("date");
var t = new Date();
dateInput.min = t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");

function say(text, cls){ msg.textContent = text; msg.className = cls || ""; }

form.addEventListener("submit", function(e){
  e.preventDefault();
  if (!form.checkValidity()) {
    form.reportValidity();
    say("Please fill in every required field.", "err");
    return;
  }
  if (!REQUEST_EMAIL) {
    say("Booking email isn't set up yet. Please call or message us to book.", "err");
    return;
  }
  var d = new FormData(form);
  var body = [
    "Service: " + d.get("service"),
    "Preferred date: " + d.get("date"),
    "Preferred time: " + d.get("time"),
    "Name: " + d.get("name"),
    "Phone: " + d.get("phone"),
    "Email: " + d.get("email"),
    "Notes: " + (d.get("notes") || "None")
  ].join("\n");
  var subject = "Appointment request: " + d.get("service") + " (" + d.get("name") + ")";
  say("Opening your email app to send the request.", "ok");
  window.location.href = "mailto:" + REQUEST_EMAIL + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
});
</script>
</body>
</html>
